    <!-- Quick words section -->
    <div id="quick-words"></div>

    <div id="keyboard">
        <div class="row">
            <button>0</button>
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>7</button>
            <button>8</button>
            <button>9</button>
        </div>
        <!-- Distribute letters in rows with QWERTY layout -->
        <div class="row">
            <button>Q</button>
            <button>W</button>
            <button>E</button>
            <button>R</button>
            <button>T</button>
            <button>Y</button>
            <button>U</button>
            <button>I</button>
            <button>O</button>
            <button>P</button>
        </div>
        <div class="row">
            <button>A</button>
            <button>S</button>
            <button>D</button>
            <button>F</button>
            <button>G</button>
            <button>H</button>
            <button>J</button>
            <button>K</button>
            <button>L</button>
        </div>
        <div class="row">
            <button>Z</button>
            <button>X</button>
            <button>C</button>
            <button>V</button>
            <button>B</button>
            <button>N</button>
            <button>M</button>
            <button id="clear-button">
                <svg clip-rule="evenodd" fill-rule="evenodd" stroke-linejoin="round" stroke-miterlimit="2"
                    viewBox="0 0 24 24" width="40" height="40" color="#000000" xmlns="http://www.w3.org/2000/svg">

                        fill-rule="nonzero" />
                </svg>
            </button>
        </div>
        <div class="row">
            <button id="spacebar">SPAZIO</button>
        </div>
    </div>

    <div id="info-modal" class="modal">
        <div class="info-modal-content">
            <span class="close">&times;</span>
            <h2>Informazioni Sistema</h2>
            <div class="info-container">
                <div class="info-row">
                    <span class="info-label">Versione Software:</span>
                    <span id="software-version" class="info-value"></span>
                </div>
                <div class="info-row">
                    <span class="info-label">Versione Database:</span>
                    <span id="db-version" class="info-value"></span>
                </div>
                <div class="info-row">
                    <span class="info-label">Parole nel dizionario:</span>
                    <span id="db-words" class="info-value"></span>
                </div>
                <div class="info-row">
                    <span class="info-label">Frasi memorizzate:</span>
                    <span id="db-sentences" class="info-value"></span>
                </div>
            </div>
        </div>
    </div>

    <div id="dictionary-modal" class="modal">
        <div class="modal-content">
            <div class="title">Parole da aggiungere al dizionario</div>
            <div id="word-list"></div>
            <div class="modal-buttons">
                <button id="modal-cancel">Annulla</button>
                <button id="modal-ok">OK</button>
            </div>
        </div>
    </div>    

    <input type="file" id="importInput" hidden>

    <script src="js/js-confetti.browser.js"></script>
    <script src="js/quickwords.js"></script>
    <script src="js/keyboard.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
